apiVersion: v1
data:
  app.properties: |
    log.level=debug
    feature.dark-mode=true
kind: ConfigMap
metadata:
  name: web-config-fd6g27d492
---
apiVersion: v1
data:
  API_TOKEN: czNjcjN0
kind: Secret
metadata:
  name: web-secret-chfmk67257
type: Opaque
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  ports:
  - name: http
    port: 80
    targetPort: http
  selector:
    app: web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - env:
        - name: BACKEND_HOST
          value: CHANGE_ME
        envFrom:
        - secretRef:
            name: web-secret-chfmk67257
        image: nginx:1.27-alpine
        name: nginx
        ports:
        - containerPort: 80
          name: http
        - containerPort: 8080
          name: debug
        volumeMounts:
        - mountPath: /etc/web
          name: config
      volumes:
      - configMap:
          name: web-config-fd6g27d492
        name: config
