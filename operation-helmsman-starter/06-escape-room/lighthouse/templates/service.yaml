apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-lighthouse
  labels:
    {{- include "lighthouse.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "lighthouse.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.servce.port }}
      targetPort: web
